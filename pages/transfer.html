<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">

  <!-- FORM STEP -->
  <div id="transferFormStep">
    <div class="flex items-center gap-3 mb-[20px]">
      <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Transfer Between Accounts</div>
    </div>

    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
      <div class="flex flex-col gap-[14px]">
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">From Account</label>
          <select id="transferFrom" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
            <option value="checking">Verceil Checking</option>
            <option value="savings">High-Yield Savings</option>
            <option value="investments">Investment Portfolio</option>
          </select>
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">To Account</label>
          <select id="transferTo" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
            <option value="savings">High-Yield Savings</option>
            <option value="checking">Verceil Checking</option>
            <option value="investments">Investment Portfolio</option>
          </select>
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Amount</label>
          <input id="transferAmount" type="number" min="0.01" step="0.01" placeholder="$0.00" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Transfer Date</label>
          <input id="transferDate" type="date" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Memo (optional)</label>
          <input id="transferMemo" type="text" placeholder="What's this for?" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div id="transferFormError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
        <button id="transferContinueBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all mt-[4px]">Continue</button>
      </div>
    </div>
  </div>

  <!-- REVIEW STEP -->
  <div id="transferReviewStep" class="hidden">
    <div class="flex items-center gap-3 mb-[20px]">
      <button data-action="back-to-form" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Transfer Review</div>
    </div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg divide-y divide-gray-100 dark:divide-white/[0.06]">
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">From</span><span id="reviewFrom" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">To</span><span id="reviewTo" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Amount</span><span id="reviewAmount" class="text-[16px] font-bold text-[#111827] dark:text-white"></span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Estimated Delivery</span><span class="text-[14px] font-semibold text-[#111827] dark:text-white">Immediate</span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Confirmation Number</span><span id="reviewConfirmation" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
    </div>
    <div id="transferReviewError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[12px]"></div>
    <button id="transferConfirmBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all mt-[16px]">Confirm Transfer</button>
  </div>

</div>
