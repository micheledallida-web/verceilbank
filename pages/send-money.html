<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">

  <div id="sendMoneyFormStep">
    <div class="flex items-center gap-3 mb-[4px]">
      <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Send Money</div>
    </div>
    <div class="text-[13px] font-normal text-white/80 dark:text-[#8E9CBA] mb-[16px] ml-[52px]">Send with Zelle®</div>

    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg">
      <div class="flex flex-col gap-[14px]">
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Recipient Name</label>
          <input id="zelleRecipientName" type="text" placeholder="Full name" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Email or Mobile Number</label>
          <input id="zelleRecipientContact" type="text" placeholder="name@email.com or (555) 555-5555" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Amount</label>
          <input id="zelleAmount" type="number" min="0.01" step="0.01" placeholder="$0.00" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-[#6B7280] dark:text-[#8E9CBA] mb-[6px] block">Memo (optional)</label>
          <input id="zelleMemo" type="text" placeholder="What's this for?" class="w-full h-[46px] px-[14px] rounded-[12px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[14px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none focus:border-[#2563EB]">
        </div>
        <div id="zelleFormError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
        <button id="zelleContinueBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all mt-[4px]">Continue</button>
      </div>
    </div>
  </div>

  <div id="sendMoneyReviewStep" class="hidden">
    <div class="flex items-center gap-3 mb-[20px]">
      <button data-action="back-to-form" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="text-[20px] font-bold text-white truncate">Payment Review</div>
    </div>
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg divide-y divide-gray-100 dark:divide-white/[0.06]">
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Recipient</span><span id="zelleReviewRecipient" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Amount</span><span id="zelleReviewAmount" class="text-[16px] font-bold text-[#111827] dark:text-white"></span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Funding Account</span><span class="text-[14px] font-semibold text-[#111827] dark:text-white">High-Yield Savings</span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Delivery Time</span><span class="text-[14px] font-semibold text-[#111827] dark:text-white">Typically minutes</span></div>
      <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Estimated Total</span><span id="zelleReviewTotal" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
    </div>
    <div id="zelleReviewError" class="hidden text-[12px] font-medium text-[#EF4444] mt-[12px]"></div>
    <button id="zelleSendBtn" class="w-full h-[46px] rounded-[14px] bg-[#2563EB] text-white text-[14px] font-semibold cursor-pointer hover:opacity-90 transition-all mt-[16px]">Send Payment</button>
  </div>

</div>
