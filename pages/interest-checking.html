<!-- ================= STEP 1: OFFER / BENEFITS ================= -->
<div id="icOfferStep" class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Vercel Interest Checking</div>
  </div>

  <!-- Hero -->
  <div class="w-full bg-gradient-to-r from-[#1E40AF] via-[#2563EB] to-[#4F46E5] dark:from-[#0C1B3A] dark:via-[#10234A] dark:to-[#152B5A] border border-white/20 dark:border-white/[0.08] rounded-[22px] p-[20px] text-white shadow-xl mb-[20px]">
    <div class="text-[10px] font-bold uppercase tracking-wider text-blue-100 dark:text-[#8E9CBA] mb-1">VERCEL INTEREST CHECKING</div>
    <div class="text-[15px] font-normal text-white/90 leading-snug">Earn <span class="text-[#FACC15] font-bold">4.00% APY</span> with no monthly maintenance fees.</div>
    <div id="icApyDisclosure" class="text-[11px] font-normal text-white/70 leading-relaxed mt-[10px] pt-[10px] border-t border-white/20"></div>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">BENEFITS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[6px] shadow-lg mb-[20px]" id="icBenefitsList"></div>

  <div class="flex flex-col gap-[10px]">
    <button id="icOpenAccountBtn" class="w-full h-[50px] rounded-[14px] bg-[#2563EB] text-white text-[15px] font-semibold cursor-pointer hover:opacity-90 transition-all shadow-lg">Open Interest Checking</button>
  </div>
</div>

<!-- ================= STEP 2: CONFIRMATION ================= -->
<div id="icConfirmStep" class="hidden w-full max-w-[430px] mx-auto px-[16px] pt-[40px] pb-[40px] text-center">
  <div class="w-[64px] h-[64px] rounded-full bg-[#10B981]/15 flex items-center justify-center mx-auto mb-[16px]">
    <svg class="w-[32px] h-[32px] text-[#10B981]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <div class="text-[20px] font-bold text-white mb-[6px]">Interest Checking Account Opened</div>
  <div class="text-[13px] font-normal text-white/80 dark:text-[#8E9CBA] mb-[24px]">Account opened successfully</div>

  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[18px] shadow-lg text-left divide-y divide-gray-100 dark:divide-white/[0.06]">
    <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Annual Percentage Yield</span><span class="text-[16px] font-bold text-[#111827] dark:text-white">4.00% APY</span></div>
    <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Confirmation Number</span><span id="icConfirmationNumber" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
    <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Initial Balance</span><span id="icInitialBalance" class="text-[14px] font-semibold text-[#111827] dark:text-white"></span></div>
    <div class="flex items-center justify-between py-[12px]"><span class="text-[13px] text-[#6B7280] dark:text-[#8E9CBA]">Also opened</span><span class="text-[14px] font-semibold text-[#111827] dark:text-white">Verceil Savings</span></div>
  </div>

  <div id="icOpeningTerms" class="text-[12px] text-white/80 dark:text-[#8E9CBA] leading-relaxed text-left mt-[14px] px-[4px]"></div>

  <div class="flex flex-col gap-[10px] mt-[20px]">
    <button id="icViewAccountBtn" class="w-full h-[50px] rounded-[14px] bg-[#2563EB] text-white text-[15px] font-semibold cursor-pointer hover:opacity-90 transition-all shadow-lg">View Account</button>
    <button id="icReturnToDashboardBtn" class="w-full h-[50px] rounded-[14px] bg-white dark:bg-[#0D1728] border border-gray-200 dark:border-white/10 text-[#111827] dark:text-white text-[15px] font-semibold cursor-pointer hover:opacity-90 transition-all">Return to Dashboard</button>
  </div>
</div>
