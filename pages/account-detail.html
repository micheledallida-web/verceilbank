<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">

  <!-- Detail Header -->
  <div class="flex items-center gap-3 mb-[24px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white/15 dark:bg-[#0D182E] border border-white/10 flex items-center justify-center text-white hover:opacity-90 transition-all cursor-pointer shadow-sm flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div id="detailAccountName" class="text-[20px] font-bold text-white truncate">Account</div>
  </div>

  <!-- Account Summary Card -->
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[22px] p-[20px] shadow-lg mb-[20px]">
    <div class="flex items-center gap-[14px] mb-[18px]">
      <div id="detailAccountIcon" class="w-[52px] h-[52px] rounded-[16px] flex items-center justify-center text-white shadow-md flex-shrink-0"></div>
      <div class="min-w-0">
        <div id="detailAccountTitle" class="text-[16px] font-semibold text-[#111827] dark:text-[#FFFFFF] whitespace-nowrap leading-tight"></div>
        <div id="detailAccountNumber" class="text-[13px] font-normal text-[#6B7280] dark:text-[#8E9CBA] mt-1"></div>
      </div>
    </div>
    <div id="detailAccountBalanceLabel" class="text-[12px] font-normal text-[#6B7280] dark:text-[#8E9CBA]">Available Balance</div>
    <div class="flex items-center justify-between gap-[12px]">
      <div id="detailAccountBalance" class="text-[32px] font-bold text-[#111827] dark:text-[#FFFFFF] tracking-tight leading-none mt-1">$0.00</div>
      <svg id="detailAccountChevron" class="hidden w-[22px] h-[22px] text-gray-400 dark:text-[#52607D] flex-shrink-0 mt-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <!-- Eligibility terms for the card above. Written by init() in
       js/pages/account-detail.js, and shown only for the credit card. -->
  <div id="detailCardEligibility" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg mb-[20px]">
    <div class="flex items-start gap-[12px]">
      <span class="w-[38px] h-[38px] rounded-[12px] bg-blue-50 dark:bg-white/5 flex items-center justify-center flex-shrink-0">
        <svg class="w-[19px] h-[19px] text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </span>
      <div class="min-w-0">
        <div id="detailCardEligibilityTitle" class="text-[13px] font-bold text-[#111827] dark:text-white"></div>
        <div id="detailCardEligibilityBody" class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA] mt-[3px] leading-relaxed"></div>
      </div>
    </div>
  </div>

  <!-- Routing & Account Numbers + Fund Account (hidden for unapplied accounts like the credit card) -->
  <div id="detailRoutingSection" class="mb-[20px]">
    <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg">
      <div class="flex items-center justify-between py-[6px]">
        <span class="text-[13px] font-normal text-[#6B7280] dark:text-[#8E9CBA]">Routing Number</span>
        <span id="detailFullRoutingNumber" class="text-[14px] font-semibold text-[#111827] dark:text-[#FFFFFF] tracking-wide"></span>
      </div>
      <div class="flex items-center justify-between py-[6px] border-t border-gray-100 dark:border-white/[0.06]">
        <span class="text-[13px] font-normal text-[#6B7280] dark:text-[#8E9CBA]">Account Number</span>
        <span id="detailFullAccountNumber" class="text-[14px] font-semibold text-[#111827] dark:text-[#FFFFFF] tracking-wide"></span>
      </div>
      <div class="mt-[8px] text-[11px] font-normal text-[#6B7280] dark:text-[#8E9CBA] leading-snug">Temporary numbers — a permanent routing and account number will be issued once your identity is verified.</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div id="detailQuickActionsSection" class="mb-[20px]">
    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">QUICK ACTIONS</div>
    <div id="detailQuickActions" class="grid grid-cols-2 gap-x-[16px] gap-y-[20px] items-start"></div>
  </div>

  <!-- Transactions List (hidden for accounts that haven't been applied for/opened yet, e.g. the credit card) -->
  <div id="detailTransactionsSection">
    <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">TRANSACTIONS</div>
    <div id="detailTransactionsList" class="w-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] px-[16px] shadow-lg py-4">
      <div class="text-center text-[14px] text-[#6B7280] dark:text-[#8E9CBA] py-2">No recent activity</div>
    </div>
  </div>

</div>
