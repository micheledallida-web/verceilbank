<div class="w-full max-w-[430px] mx-auto px-[16px] pt-[14px] pb-[40px]">
  <div class="flex items-center gap-3 mb-[16px]">
    <button data-action="close" class="w-[40px] h-[40px] rounded-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] flex items-center justify-center text-[#111827] dark:text-white shadow-lg cursor-pointer flex-shrink-0" aria-label="Back">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="text-[20px] font-bold text-white truncate">Contact Support</div>
  </div>

  <div class="flex flex-col gap-[10px] mb-[20px]">
    <a href="tel:+18005550123" class="w-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg flex items-center justify-between cursor-pointer"><span class="text-[14px] font-semibold text-[#111827] dark:text-white">📞 Call Support</span><span class="text-[12px] text-[#6B7280] dark:text-[#8E9CBA]">(800) 555-0123</span></a>
    <button id="contactCallbackBtn" class="w-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg flex items-center justify-between cursor-pointer text-left"><span class="text-[14px] font-semibold text-[#111827] dark:text-white">☎️ Schedule a Callback</span><svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    <button id="contactVideoBtn" class="w-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg flex items-center justify-between cursor-pointer text-left"><span class="text-[14px] font-semibold text-[#111827] dark:text-white">🎥 Video Banking</span><svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    <button id="contactBranchBtn" class="w-full bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[16px] p-[14px] shadow-lg flex items-center justify-between cursor-pointer text-left"><span class="text-[14px] font-semibold text-[#111827] dark:text-white">🏦 Branch Appointment</span><svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
  </div>

  <div class="text-[11px] font-bold tracking-[1.2px] text-white/75 dark:text-[#8E9CBA] uppercase mb-[8px]">SUPPORT HOURS</div>
  <div class="bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg divide-y divide-gray-100 dark:divide-white/[0.06] mb-[16px]">
    <div class="flex justify-between py-[8px] text-[13px]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">General Banking</span><span class="font-semibold text-[#111827] dark:text-white">24/7</span></div>
    <div class="flex justify-between py-[8px] text-[13px]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Card Services</span><span class="font-semibold text-[#111827] dark:text-white">24/7</span></div>
    <div class="flex justify-between py-[8px] text-[13px]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Fraud Department</span><span class="font-semibold text-[#111827] dark:text-white">24/7</span></div>
    <div class="flex justify-between py-[8px] text-[13px]"><span class="text-[#6B7280] dark:text-[#8E9CBA]">Investment Services</span><span class="font-semibold text-[#111827] dark:text-white">Mon–Fri, 8am–8pm ET</span></div>
  </div>

  <div id="callbackFormWrap" class="hidden bg-white dark:bg-[#0D1728] border border-transparent dark:border-white/[0.06] rounded-[20px] p-[16px] shadow-lg">
    <div class="flex flex-col gap-[10px]">
      <input id="callbackPhone" type="tel" placeholder="Phone number" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none">
      <input id="callbackTime" type="datetime-local" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white outline-none">
      <input id="callbackTopic" type="text" placeholder="Topic" class="w-full h-[42px] px-[12px] rounded-[10px] bg-gray-50 dark:bg-white/5 border border-gray-200 dark:border-white/10 text-[13px] text-[#111827] dark:text-white placeholder-gray-400 dark:placeholder-[#52607D] outline-none">
      <div id="callbackError" class="hidden text-[12px] font-medium text-[#EF4444]"></div>
      <button id="callbackSubmitBtn" class="w-full h-[42px] rounded-[12px] bg-[#2563EB] text-white text-[13px] font-semibold cursor-pointer">Request Callback</button>
    </div>
  </div>
</div>
